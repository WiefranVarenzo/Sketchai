<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sketch to Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        canvas {
            border: 2px solid #ccc;
            cursor: crosshair;
            border-radius: 4px;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        #resultImage {
            max-width: 512px;
            max-height: 512px;
            border: 2px dashed #ccc;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>AI Sketch to Image</h1>

    <div class="container">
        <div class="panel">
            <h3>Kanvas Gambar</h3>
            <canvas id="sketchCanvas" width="512" height="512"></canvas>
            
            <div class="controls">
                <button onclick="clearCanvas()">Hapus Kanvas</button>
                <input type="color" id="colorPicker" value="#000000">
                <input type="range" id="brushSize" min="1" max="20" value="5">
            </div>

            <input type="text" id="promptInput" placeholder="Contoh: Jadikan mobil sport cyberpunk 3D yang realistis">
            
            <div style="margin-top: 15px;">
                <button id="generateBtn" onclick="generateImage()">Generate AI Image</button>
            </div>
        </div>

        <div class="panel" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 512px;">
            <h3>Hasil Generation</h3>
            <span id="loadingText" style="display: none; color: #007bff; font-weight: bold;">AI sedang berpikir... (bisa butuh beberapa detik)</span>
            <img id="resultImage" alt="Hasil AI akan muncul di sini">
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
